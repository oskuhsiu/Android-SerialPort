apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'me.f1reking.serialportlib'
    compileSdk 33
    // 配合 16KB page size：用本機已安裝、且支援 -Wl,-z,max-page-size=16384 的 NDK。
    // r23.2 + 該 linker flag 即可產生 16KB 對齊的 .so（不必倚賴新版 NDK 的預設行為）。
    ndkVersion '23.2.8568313'

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 33
        versionCode 1
        versionName "1.6.1"

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    // AGP 7.1+ 要先宣告要發佈的 variant，components.release 才會存在
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

afterEvaluate {
    publishing {
        publications {
            // jitpack 會以 repo 推導座標 com.github.oskuhsiu:Android-SerialPort:<tag>
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.oskuhsiu'
                artifactId = 'Android-SerialPort'
                version = '1.6.1'
            }
        }
    }
}
